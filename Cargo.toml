[package]
name = "rtop"
version = "0.1.0"
edition = "2024"
description = "htop, but with time-series charts, gauges, GPU/NPU tracking, and Docker filtering"
license = "MIT"
repository = "https://github.com/regisrex/rtop"
readme = "README.md"
authors = ["regisrex"]

[package.metadata.deb]
maintainer = "regisrex <regisrex@users.noreply.github.com>"
copyright = "2026, regisrex"
license-file = ["LICENSE", "0"]
extended-description = """\
rtop is a terminal system monitor like htop, but with live time-series \
charts for CPU, memory, network, disk, GPU and NPU usage, color-graded \
gauges, and a Docker container panel with filtering."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/rtop", "usr/bin/", "755"],
]

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
ratatui = "0.30.2"
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
io-kit-sys = "0.5.0"
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13.0"
