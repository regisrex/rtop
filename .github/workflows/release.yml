name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: macos-arm64
            deb: false
            release_dir: target/aarch64-apple-darwin/release
          - target: x86_64-apple-darwin
            os: macos-14
            asset: macos-x86_64
            deb: false
            release_dir: target/x86_64-apple-darwin/release
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: linux-x86_64
            deb: true
            release_dir: target/release
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: linux-arm64
            deb: true
            release_dir: target/release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # On Linux this toolchain is only used to run `cargo install cargo-deb`
      # on the host afterward — the actual binary is built with its own fresh
      # toolchain inside the old-glibc container below, so no cross-target
      # setup is needed here for Linux.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && matrix.target || '' }}

      - name: Build (macOS, native cross-target)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Linux binaries build inside an old Ubuntu 20.04 container (glibc 2.31)
      # instead of natively on the runner's own Ubuntu, which ships a much
      # newer glibc (2.39+). Rust records whatever glibc is present at build
      # time as the binary's *minimum* required version, so building on the
      # bleeding-edge runner broke installation on anything older than the
      # runner's own Ubuntu release — i.e. most real systems. This runs
      # natively on each runner's own architecture (no QEMU), so it's just as
      # fast as building on the host directly.
      - name: Build (Linux, old-glibc container for broad compatibility)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/work -w /work ubuntu:20.04 bash -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq curl build-essential pkg-config
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked
          '

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/rtop-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" \
            -C "${{ matrix.release_dir }}" rtop

      - name: Install cargo-deb
        if: matrix.deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        if: matrix.deb
        run: cargo deb --no-build --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rtop-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  apt-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rtop-linux-*
          path: artifacts
          merge-multiple: true

      - name: Import signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build apt repository
        working-directory: gh-pages
        env:
          KEYID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -eu
          mkdir -p apt/pool/main/r/rtop
          cp ../artifacts/*.deb apt/pool/main/r/rtop/
          cd apt
          mkdir -p dists/stable/main/binary-amd64 dists/stable/main/binary-arm64
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k9f dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -k9f dists/stable/main/binary-arm64/Packages
          cd dists/stable
          {
            echo "Origin: rtop"
            echo "Label: rtop"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: amd64 arm64"
            echo "Components: main"
            echo "Description: rtop apt repository"
          } > Release
          apt-ftparchive release . >> Release
          gpg --batch --yes --default-key "$KEYID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$KEYID" --clearsign -o InRelease Release

      - name: Publish gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to publish" || git commit -m "Publish apt repo for ${{ github.ref_name }}"
          git push
